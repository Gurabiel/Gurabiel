
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="800" height="50" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.glint{animation:glint 3.2s ease-in-out infinite}
@keyframes glint{0%{transform:translateX(-170px)}100%{transform:translateX(830px)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.88,1.15) skewX(5deg)}50%{transform:scale(1.07,.9) skewX(-4deg)}75%{transform:scale(.94,1.1) skewX(2deg)}}
.em{fill:#ffb347;opacity:0;animation:rise 2.6s linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.95}100%{transform:translate(var(--dx),-34px);opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.2)}}
</style>
<defs>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#c0152a" stop-opacity="0"/><stop offset=".3" stop-color="#c0152a"/><stop offset=".5" stop-color="#ff6a1a"/><stop offset=".7" stop-color="#c0152a"/><stop offset="1" stop-color="#c0152a" stop-opacity="0"/></linearGradient>
<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#ffd27a" stop-opacity="0"/><stop offset=".5" stop-color="#fff2c8" stop-opacity=".95"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></linearGradient>
<linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" stop-opacity="0"/><stop offset=".35" stop-color="#ff9a3d" stop-opacity=".9"/><stop offset=".75" stop-color="#e0301a"/><stop offset="1" stop-color="#5a0a0a"/></linearGradient>
<radialGradient id="hg"><stop offset="0" stop-color="#ff9a3d" stop-opacity=".8"/><stop offset="1" stop-color="#c0152a" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0" y="36" width="800" height="2" fill="url(#ln)"/>
<rect class="glint" x="0" y="35" width="150" height="4" fill="url(#gl)"/>
<circle class="halo" cx="400" cy="32" r="22" fill="url(#hg)"/>
<g transform="translate(400 38) scale(.34 .3)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)"/></g>
<g transform="translate(386 38) scale(.2 .17)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-.5s"/></g>
<g transform="translate(414 38) scale(.2 .17)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-.9s"/></g>
<circle class="em" cx="396" cy="20" r="1.3" style="--dx:-6px"/>
<circle class="em" cx="404" cy="22" r="1.1" style="--dx:7px;animation-delay:-1s"/>
<circle class="em" cx="400" cy="18" r="1.4" style="--dx:2px;animation-delay:-1.8s"/>
</svg>

<g transform="rotate(240 160 160) translate(160 34) scale(.42 .36)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-1.36s"/></g>
<g transform="rotate(270 160 160) translate(160 34) scale(.42 .36)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-1.53s"/></g>
<g transform="rotate(300 160 160) translate(160 34) scale(.42 .36)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-1.70s"/></g>
<g transform="rotate(330 160 160) translate(160 34) scale(.42 .36)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-1.87s"/></g>
<circle cx="160" cy="160" r="118" fill="url(#bgc)" stroke="#ff6a1a" stroke-opacity=".55" stroke-width="2"/>
<circle class="pulse" cx="160" cy="160" r="92" fill="url(#aura)"/>
<circle class="r1" cx="160" cy="160" r="106" fill="none" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="3 9" stroke-opacity=".85"/>
<circle class="r2" cx="160" cy="160" r="94" fill="none" stroke="#c0152a" stroke-width="3" stroke-dasharray="40 14 8 14" stroke-opacity=".9"/>
<text class="serif glow" x="160" y="190" text-anchor="middle" font-size="88" fill="#ff5a14" filter="url(#b)">修羅</text>

<g transform="rotate(150 160 160) translate(160 34) scale(.42 .36)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-0.85s"/></g>

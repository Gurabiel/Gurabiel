
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Shura" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.serif{font-family:'Noto Serif CJK JP','Yu Mincho','Hiragino Mincho ProN','MS Mincho',Georgia,serif}
.r1{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}
.r2{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.86,1.16) skewX(5deg)}50%{transform:scale(1.08,.9) skewX(-4deg)}75%{transform:scale(.94,1.1) skewX(2deg)}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}40%{opacity:.85}70%{opacity:.5}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
.em{fill:#ffb347;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}100%{transform:translate(var(--dx),-120px);opacity:0}}
</style>
<defs>
<radialGradient id="bgc"><stop offset="0" stop-color="#2a0a06"/><stop offset=".7" stop-color="#0a0302"/><stop offset="1" stop-color="#050202"/></radialGradient>
<radialGradient id="aura"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".55"/><stop offset="1" stop-color="#c0152a" stop-opacity="0"/></radialGradient>
<linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" stop-opacity="0"/><stop offset=".35" stop-color="#ff9a3d" stop-opacity=".9"/><stop offset=".75" stop-color="#e0301a"/><stop offset="1" stop-color="#5a0a0a"/></linearGradient>
<filter id="b"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<g transform="rotate(0 160 160) translate(160 34) scale(.42 .36)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:0.00s"/></g>
<g transform="rotate(30 160 160) translate(160 34) scale(.42 .36)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-0.17s"/></g>
<g transform="rotate(60 160 160) translate(160 34) scale(.42 .36)"><path class="fl" d="M0 0C-22-18-18-48-2-92C2-62 24-46 20-20C18-8 10 0 0 0Z" fill="url(#flame)" style="animation-delay:-0.34s"/></g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180" role="img" aria-label="Deathblow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.serif{font-family:'Noto Serif CJK JP','Yu Mincho','Hiragino Mincho ProN','MS Mincho',Georgia,serif}
.ring{fill:none;stroke:#c0152a;stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 3.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:0}15%{opacity:.9}65%{transform:scale(1.6);opacity:0}100%{transform:scale(1.6);opacity:0}}
.k{transform-box:fill-box;transform-origin:center;opacity:0;animation:k 3.6s ease-out infinite}
@keyframes k{0%{opacity:0;transform:scale(1.7)}10%{opacity:1;transform:scale(1)}20%{transform:scale(1.07)}30%{transform:scale(1)}80%{opacity:1}95%,100%{opacity:0}}
.cut{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:cut 3.6s ease-out infinite}
@keyframes cut{0%,6%{stroke-dashoffset:1;opacity:0}8%{stroke-dashoffset:1;opacity:1}14%{stroke-dashoffset:0;opacity:1}40%{stroke-dashoffset:0;opacity:0}100%{opacity:0}}
.glow{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.5}20%{opacity:1}}
</style>
<defs><filter id="g"><feGaussianBlur stdDeviation="3"/></filter></defs>
<circle cx="180" cy="90" r="74" fill="#0d0d0d" opacity=".92"/>
<circle cx="180" cy="90" r="74" fill="none" stroke="#c9a227" stroke-opacity=".5"/>
<circle class="ring" cx="180" cy="90" r="60"/>
<circle class="ring" cx="180" cy="90" r="60" style="animation-delay:.5s"/>
<text class="serif glow" x="180" y="116" text-anchor="middle" font-size="68" fill="#c0152a" filter="url(#g)">忍殺</text>
<text class="serif k" x="180" y="116" text-anchor="middle" font-size="68" fill="#d71a2b" stroke="#4a0a12" stroke-width="1">忍殺</text>
<path class="cut" pathLength="1" d="M 90 150 L 270 30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>

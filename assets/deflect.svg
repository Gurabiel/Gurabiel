
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="Deflect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.spark{stroke:#ffd76a;stroke-width:2.2;stroke-linecap:round;fill:none;stroke-dasharray:.3 1.5;stroke-dashoffset:.3;opacity:0;animation:spark 2.4s ease-out infinite}
@keyframes spark{0%,7%{stroke-dashoffset:.3;opacity:0}8%{stroke-dashoffset:.3;opacity:1}32%{stroke-dashoffset:-.9;opacity:0}100%{stroke-dashoffset:-.9;opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop 2.4s ease-out infinite}
@keyframes pop{0%,7%{transform:scale(.2);opacity:0}9%{transform:scale(1);opacity:.95}24%{transform:scale(1.8);opacity:0}100%{opacity:0}}
.shake{animation:shake 2.4s linear infinite}
@keyframes shake{0%,7%{transform:translate(0,0)}9%{transform:translate(-2.5px,1px)}11%{transform:translate(2.5px,-1px)}13%{transform:translate(-1.5px,0)}15%,100%{transform:translate(0,0)}}
.b1{animation:b1 2.4s ease-out infinite}
.b2{animation:b2 2.4s ease-out infinite}
@keyframes b1{0%{transform:translate(-40px,26px);opacity:0}6%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:1}}
@keyframes b2{0%{transform:translate(40px,26px);opacity:0}6%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:1}}
</style>
<defs>
<linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#8d8d8d"/><stop offset=".5" stop-color="#f4f4f4"/><stop offset="1" stop-color="#9a9a9a"/></linearGradient>
<radialGradient id="hot"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
</defs>
<g class="shake">
<g class="b1">
<line x1="95" y1="149" x2="290" y2="35" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/>
<line x1="50" y1="175" x2="95" y2="149" stroke="#3a2a0a" stroke-width="9" stroke-linecap="round"/>
<line x1="50" y1="175" x2="95" y2="149" stroke="#c9a227" stroke-width="2" stroke-dasharray="3 5"/>
<line x1="104" y1="144" x2="104" y2="144" stroke="#c9a227" stroke-width="12" stroke-linecap="round"/>
</g>
<g class="b2">
<line x1="265" y1="149" x2="70" y2="35" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/>
<line x1="310" y1="175" x2="265" y2="149" stroke="#3a2a0a" stroke-width="9" stroke-linecap="round"/>
<line x1="310" y1="175" x2="265" y2="149" stroke="#c9a227" stroke-width="2" stroke-dasharray="3 5"/>
<line x1="256" y1="144" x2="256" y2="144" stroke="#c9a227" stroke-width="12" stroke-linecap="round"/>
</g>
</g>
<circle class="pop" cx="180" cy="99" r="26" fill="url(#hot)"/>
<g transform="translate(180 99)">
<line class="spark" pathLength="1" x1="12" y1="0" x2="78" y2="0" transform="rotate(0)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="62" y2="0" transform="rotate(28)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="84" y2="0" transform="rotate(55)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="60" y2="0" transform="rotate(85)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="76" y2="0" transform="rotate(115)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="64" y2="0" transform="rotate(145)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="82" y2="0" transform="rotate(175)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="60" y2="0" transform="rotate(205)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="78" y2="0" transform="rotate(235)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="64" y2="0" transform="rotate(265)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="84" y2="0" transform="rotate(295)"/>
<line class="spark" pathLength="1" x1="12" y1="0" x2="62" y2="0" transform="rotate(325)"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Gabriel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.serif{font-family:'Noto Serif CJK JP','Yu Mincho','Hiragino Mincho ProN','MS Mincho',Georgia,'Times New Roman',serif}
.petal{fill:#b3202a;opacity:.85;transform-box:fill-box;transform-origin:center;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0deg)}100%{transform:translate(-90px,300px) rotate(540deg)}}
.fog{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(160px)}}
.moon{animation:moon 5s ease-in-out infinite}
@keyframes moon{0%,100%{opacity:.14}50%{opacity:.24}}
.slash{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:slash 6s ease-out infinite}
@keyframes slash{0%,32%{stroke-dashoffset:1;opacity:0}33%{stroke-dashoffset:1;opacity:1}38%{stroke-dashoffset:0;opacity:1}55%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
.flash{opacity:0;animation:flash 6s linear infinite}
@keyframes flash{0%,37%{opacity:0}39%{opacity:.32}52%{opacity:0}100%{opacity:0}}
.hit{animation:hit 6s linear infinite}
@keyframes hit{0%,37%{transform:translate(0,0)}39%{transform:translate(-3px,1px)}41%{transform:translate(2px,-1px)}43%,100%{transform:translate(0,0)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d0d"/><stop offset=".55" stop-color="#4a0a12"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
<radialGradient id="mist"><stop offset="0" stop-color="#f2e9d8" stop-opacity=".18"/><stop offset="1" stop-color="#f2e9d8" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="900" height="260" fill="url(#bg)"/>
<circle class="moon" cx="740" cy="78" r="52" fill="#f2e9d8"/>
<g class="fog"><ellipse cx="300" cy="215" rx="300" ry="34" fill="url(#mist)"/></g>
<g class="fog" style="animation-duration:19s;animation-direction:alternate-reverse"><ellipse cx="620" cy="235" rx="320" ry="30" fill="url(#mist)"/></g>
<polygon points="0,260 0,215 100,190 190,212 290,178 400,214 500,195 600,220 700,185 800,212 900,192 900,260" fill="#070707"/>
<ellipse class="petal" cx="110" cy="0" rx="6" ry="3" style="animation-duration:8s;animation-delay:-1s"/>
<ellipse class="petal" cx="240" cy="0" rx="5" ry="2.6" style="animation-duration:10s;animation-delay:-6s"/>
<ellipse class="petal" cx="360" cy="0" rx="6" ry="3" style="animation-duration:9s;animation-delay:-3s"/>
<ellipse class="petal" cx="470" cy="0" rx="4.5" ry="2.4" style="animation-duration:11s;animation-delay:-8s"/>
<ellipse class="petal" cx="590" cy="0" rx="6" ry="3" style="animation-duration:8.5s;animation-delay:-4s"/>
<ellipse class="petal" cx="700" cy="0" rx="5" ry="2.6" style="animation-duration:12s;animation-delay:-9s"/>
<ellipse class="petal" cx="810" cy="0" rx="6" ry="3" style="animation-duration:9.5s;animation-delay:-2s"/>
<ellipse class="petal" cx="880" cy="0" rx="4.5" ry="2.4" style="animation-duration:10.5s;animation-delay:-7s"/>
<g class="hit">
<text class="serif" x="450" y="86" text-anchor="middle" font-size="24" letter-spacing="16" fill="#c9a227">隻狼</text>
<text class="serif" x="450" y="158" text-anchor="middle" font-size="76" letter-spacing="14" fill="#f2e9d8">GABRIEL</text>
<line x1="250" y1="186" x2="350" y2="186" stroke="#c9a227" stroke-opacity=".6"/>
<line x1="550" y1="186" x2="650" y2="186" stroke="#c9a227" stroke-opacity=".6"/>
<text class="serif" x="450" y="192" text-anchor="middle" font-size="15" letter-spacing="9" fill="#c9a227">KOTLIN DEVELOPER</text>
</g>
<rect class="flash" width="900" height="260" fill="#c0152a"/>
<path class="slash" pathLength="1" d="M 150 232 L 760 28" stroke="#c0152a" stroke-width="10" fill="none" filter="url(#blur)"/>
<path class="slash" pathLength="1" d="M 150 232 L 760 28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>

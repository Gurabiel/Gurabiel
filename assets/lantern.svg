<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" width="320" height="130" role="img" aria-label="Eye" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s ease-in-out infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.06)}96%{transform:scaleY(1)}}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.45;transform:scale(.9)}40%{opacity:1;transform:scale(1.18)}70%{opacity:.6;transform:scale(1)}}
.look{animation:look 6s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}60%{transform:translateX(6px)}}
.wisp{fill:none;stroke:#ff7a2a;stroke-width:3;stroke-linecap:round;stroke-dasharray:.28 .72;animation:flow 1.8s linear infinite}
.wisp2{stroke:#ffd27a;stroke-width:1.6;animation-duration:1.3s;animation-delay:-.5s}
@keyframes flow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.em{fill:#ffb347;opacity:0;animation:rise 3s linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.95}100%{transform:translate(var(--dx),-48px);opacity:0}}
</style>
<defs>
<radialGradient id="iris" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c8"/><stop offset=".35" stop-color="#ffa24a"/><stop offset=".75" stop-color="#d4300f"/><stop offset="1" stop-color="#4a0a05"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".85"/><stop offset="1" stop-color="#c0152a" stop-opacity="0"/></radialGradient>
<clipPath id="eyeclip"><path d="M70 65 Q180 -2 304 65 Q180 128 70 65Z"/></clipPath>
</defs>
<circle class="glow" cx="187" cy="65" r="58" fill="url(#halo)"/>
<path class="wisp" pathLength="1" d="M70 65 C52 40 40 90 22 60 S8 48 2 62"/>
<path class="wisp wisp2" pathLength="1" d="M72 68 C56 52 44 84 28 66 S14 58 6 68"/>
<g class="blink">
<path d="M70 65 Q180 -2 304 65 Q180 128 70 65Z" fill="#140503" stroke="#ff6a1a" stroke-opacity=".7" stroke-width="2"/>
<g clip-path="url(#eyeclip)"><g class="look">
<circle cx="187" cy="65" r="40" fill="url(#iris)"/>
<ellipse cx="187" cy="65" rx="7" ry="30" fill="#050101"/>
<circle cx="174" cy="50" r="5" fill="#fff" opacity=".7"/>
</g></g>
<path d="M70 65 Q180 -2 304 65" fill="none" stroke="#3a0d06" stroke-width="5"/>
</g>
<circle class="em" cx="120" cy="42" r="1.4" style="--dx:-6px"/>
<circle class="em" cx="150" cy="30" r="1.2" style="--dx:5px;animation-delay:-1s"/>
<circle class="em" cx="90" cy="50" r="1.5" style="--dx:-9px;animation-delay:-2s"/>
</svg>

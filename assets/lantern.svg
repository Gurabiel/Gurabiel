
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 210" width="120" height="210" role="img" aria-label="Lantern" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sway{transform-origin:60px 0px;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.glow{transform-box:fill-box;transform-origin:center;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.55;transform:scale(1)}25%{opacity:.85;transform:scale(1.06)}50%{opacity:.6;transform:scale(.97)}75%{opacity:.9;transform:scale(1.04)}}
.ember{fill:#ffb347;opacity:0;animation:ember 3s ease-out infinite}
@keyframes ember{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx,6px),-70px);opacity:0}}
</style>
<defs>
<radialGradient id="halo"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".75"/><stop offset="1" stop-color="#c0152a" stop-opacity="0"/></radialGradient>
<radialGradient id="body" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#d71a2b"/><stop offset="1" stop-color="#5a0a14"/></radialGradient>
</defs>
<g class="sway">
<circle class="glow" cx="60" cy="88" r="62" fill="url(#halo)"/>
<line x1="60" y1="0" x2="60" y2="32" stroke="#c9a227" stroke-width="2"/>
<rect x="40" y="32" width="40" height="9" rx="2" fill="#2a1d08" stroke="#c9a227"/>
<ellipse cx="60" cy="88" rx="38" ry="46" fill="url(#body)" stroke="#2a1d08" stroke-width="2"/>
<ellipse cx="60" cy="88" rx="25" ry="46" fill="none" stroke="#2a1d08" stroke-opacity=".7"/>
<ellipse cx="60" cy="88" rx="11" ry="46" fill="none" stroke="#2a1d08" stroke-opacity=".7"/>
<line x1="60" y1="42" x2="60" y2="134" stroke="#2a1d08" stroke-opacity=".7"/>
<rect x="42" y="132" width="36" height="9" rx="2" fill="#2a1d08" stroke="#c9a227"/>
<line x1="60" y1="141" x2="60" y2="172" stroke="#c9a227" stroke-width="2"/>
<rect x="55" y="172" width="10" height="22" rx="2" fill="#7a0f1a" stroke="#c9a227" stroke-opacity=".7"/>
</g>
<circle class="ember" cx="50" cy="70" r="1.6" style="--dx:-8px;animation-delay:0s"/>
<circle class="ember" cx="68" cy="60" r="1.3" style="--dx:6px;animation-delay:-1s"/>
<circle class="ember" cx="58" cy="80" r="1.8" style="--dx:10px;animation-delay:-2s"/>
<circle class="ember" cx="72" cy="74" r="1.2" style="--dx:-6px;animation-delay:-1.5s"/>
</svg>

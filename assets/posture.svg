
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 70" width="700" height="70" role="img" aria-label="Posture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.serif{font-family:'Noto Serif CJK JP','Yu Mincho','Hiragino Mincho ProN','MS Mincho',Georgia,serif}
.f{transform-box:fill-box;animation:fill 4s ease-in infinite}
.l{transform-origin:100% 50%}
.r{transform-origin:0% 50%}
@keyframes fill{0%{transform:scaleX(0);opacity:1}72%{transform:scaleX(1);opacity:1}78%{transform:scaleX(1);opacity:1}88%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
.brk{opacity:0;animation:brk 4s linear infinite}
@keyframes brk{0%,71%{opacity:0}73%{opacity:.95}84%{opacity:0}100%{opacity:0}}
.shake{animation:shake 4s linear infinite}
@keyframes shake{0%,71%{transform:translate(0,0)}73%{transform:translate(-3px,0)}75%{transform:translate(3px,0)}77%{transform:translate(-2px,0)}79%,100%{transform:translate(0,0)}}
.dia{animation:dia 2s ease-in-out infinite}
@keyframes dia{50%{opacity:.35}}
</style>
<defs>
<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#4a0a12"/><stop offset="1" stop-color="#e0202f"/></linearGradient>
<linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#e0202f"/><stop offset="1" stop-color="#4a0a12"/></linearGradient>
</defs>
<text class="serif" x="28" y="43" font-size="22" fill="#c9a227">体幹</text>
<g class="shake">
<rect x="100" y="28" width="500" height="14" fill="#141414" stroke="#c9a227" stroke-opacity=".55"/>
<rect class="f l" x="100" y="29" width="250" height="12" fill="url(#gl)"/>
<rect class="f r" x="350" y="29" width="250" height="12" fill="url(#gr)"/>
<rect class="brk" x="100" y="28" width="500" height="14" fill="#ffffff"/>
</g>
<rect class="dia" x="345" y="16" width="10" height="10" fill="#c9a227" transform="rotate(45 350 21)"/>
<rect class="dia" x="345" y="44" width="10" height="10" fill="#c9a227" transform="rotate(45 350 49)" style="animation-delay:-1s"/>
<rect x="618" y="31" width="8" height="8" fill="none" stroke="#c9a227" stroke-opacity=".6" transform="rotate(45 622 35)"/>
<rect x="642" y="31" width="8" height="8" fill="none" stroke="#c9a227" stroke-opacity=".4" transform="rotate(45 646 35)"/>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.glint{animation:glint 3.5s ease-in-out infinite}
@keyframes glint{0%{transform:translateX(-160px)}100%{transform:translateX(820px)}}
.core{animation:core 2s ease-in-out infinite}
@keyframes core{50%{opacity:.3}}
</style>
<defs>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#7a0f1a" stop-opacity="0"/><stop offset=".3" stop-color="#7a0f1a"/><stop offset=".5" stop-color="#c9a227"/><stop offset=".7" stop-color="#7a0f1a"/><stop offset="1" stop-color="#7a0f1a" stop-opacity="0"/></linearGradient>
<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0" y="11" width="800" height="2" fill="url(#ln)"/>
<rect class="glint" x="0" y="10" width="140" height="4" fill="url(#gl)"/>
<rect x="393" y="5" width="14" height="14" fill="#0d0d0d" stroke="#c9a227" transform="rotate(45 400 12)"/>
<rect class="core" x="397" y="9" width="6" height="6" fill="#c0152a" transform="rotate(45 400 12)"/>
</svg>
